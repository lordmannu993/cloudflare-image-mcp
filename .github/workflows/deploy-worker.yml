name: Deploy worker/

# Deploys the minimal `worker/` Worker (FLUX.2 generations + Jev decisions proxy).
# No R2 bucket, no pre-provisioning. Secrets come from repository secrets.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0f250-cloudflare-image-mcp
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          API_KEYS: ${{ secrets.API_KEYS }}
        run: |
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$CLOUDFLARE_API_TOKEN"  | npx wrangler secret put CLOUDFLARE_API_TOKEN
          if [ -n "$JEV_API_KEY" ]; then
            printf '%s' "$JEV_API_KEY" | npx wrangler secret put JEV_API_KEY
          else
            echo "JEV_API_KEY not set - /v1/decisions will require an X-Jev-Api-Key header."
          fi
          if [ -n "$API_KEYS" ]; then
            printf '%s' "$API_KEYS" | npx wrangler secret put API_KEYS
          fi

      - name: Resolve Worker URL and verify /health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUBDOMAIN=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);console.log(j.result?.subdomain||'')})")
          if [ -z "$SUBDOMAIN" ]; then
            echo "Could not resolve workers.dev subdomain (is it enabled on the account?)"
            exit 1
          fi
          URL="https://cloudflare-image-worker.$SUBDOMAIN.workers.dev"
          echo "Worker URL: $URL"
          sleep 10
          curl -sS --retry 5 --retry-delay 5 "$URL/health" | tee /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.config.workers_ai_credentials){console.error('AI credentials missing on the Worker');process.exit(1)}"
          {
            echo "### Deployed"
            echo ""
            echo "Paste this into **Settings → Pictures**:"
            echo ""
            echo '```'
            echo "$URL"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
